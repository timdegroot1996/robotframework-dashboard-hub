[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-dashboard-hub"
dynamic = ["version"]
description = "One overview page across several robotframework-dashboard databases and servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim de Groot" }]
requires-python = ">=3.10"
# needs DatabaseProcessor.get_run_stats and DependencyProcessor(js_root, css_root, dependencies, exclude),
# checked at import with a clear message (compat.py) until the release that ships them is the minimum here
dependencies = ["robotframework-dashboard>=2.5.0"]
keywords = ["robotframework", "dashboard", "hub", "testing", "reporting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Tool",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
robotdashboardhub = "robotframework_dashboard_hub.cli:main"

[project.optional-dependencies]
# the server extra: tests/test_contract.py runs a real robotdashboard --server
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.15", "robotframework-dashboard[server]"]

[project.urls]
Homepage = "https://github.com/timdegroot1996/robotframework-dashboard-hub"
Issues = "https://github.com/timdegroot1996/robotframework-dashboard-hub/issues"
Changelog = "https://github.com/timdegroot1996/robotframework-dashboard-hub/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "robotframework_dashboard_hub.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotframework_dashboard_hub = ["py.typed", "templates/*.html", "js/*.js", "css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["robotframework_dashboard_hub", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["robotframework_dashboard", "robotframework_dashboard.*"]
ignore_missing_imports = true
